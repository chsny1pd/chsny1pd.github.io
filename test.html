<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detective Conan Wiki</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>

  <body
    class="bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 text-white"
  >
    <!-- ================= HEADER ================= -->
    <header
      class="sticky top-0 z-50 backdrop-blur-md bg-black/40 border-b border-white/10"
    >
      <div
        class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between"
      >
        <!-- Logo -->
        <div class="flex items-center gap-3">
          <img
            src="Image/conanlogo2.jpg"
            alt="Conan Logo"
            class="w-12 h-12 rounded-full border-2 border-violet-500"
          />

          <div>
            <h1
              class="text-2xl font-bold bg-gradient-to-r from-violet-400 to-pink-400 bg-clip-text text-transparent"
            >
              Detective Conan Wiki
            </h1>

            <p class="text-sm text-slate-400">Mystery • Detective • Anime</p>
          </div>
        </div>

        <!-- Desktop Menu -->
        <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
          <a href="#" class="hover:text-violet-400 transition"> Home </a>

          <a href="#" class="hover:text-violet-400 transition"> Characters </a>

          <a href="#" class="hover:text-violet-400 transition"> Movies </a>

          <a href="#" class="hover:text-violet-400 transition"> Episodes </a>

          <a href="#" class="hover:text-violet-400 transition"> Contact </a>
        </nav>

        <!-- Mobile Button -->
        <button class="md:hidden text-3xl">☰</button>
      </div>
    </header>

    
  </body>
</html>
